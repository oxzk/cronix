[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cronix"
version = "0.1.0"
description = "A lightweight, production-ready task scheduling system based on FastAPI and MySQL"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Cronix Team" }
]
keywords = ["fastapi", "scheduler", "cron", "task", "mysql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.136.2",
    "uvicorn[standard]>=0.48.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "sqlalchemy[asyncio]>=2.0.45",
    "aiomysql>=0.3.2",
    "httpx>=0.28.1",
    "croniter>=6.0.0",
    "pyjwt>=2.10.1",
    "bcrypt>=4.1.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.urls]
Homepage = "https://github.com/oxzk/cronix"
Repository = "https://github.com/oxzk/cronix"
Issues = "https://github.com/oxzk/cronix/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cronix*"]
