[project]
name = "cronix"
version = "0.1.0"
description = "cronix - 单用户、单机的定时任务管理系统"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "pyjwt>=2.15.1",
    "argon2-cffi>=25.1.0",
    "loguru>=0.7.3",
    "croniter>=7.0.0",
    "httpx>=0.28.1",
    "redis>=8.1.0",
    "aiomysql>=0.3.2",
    "pymongo>=4.19.0",
    "aio-pika>=10.2.3",
]

[dependency-groups]
dev = ["ruff>=0.17.4", "mypy>=2.4.1"]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
files = ["app"]
