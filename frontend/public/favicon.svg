<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Cronix</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="clock" x1="20" y1="20" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="hands" x1="26" y1="26" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- Outer ring -->
  <circle cx="32" cy="32" r="22" stroke="#334155" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Clock face -->
  <circle cx="32" cy="32" r="16" fill="url(#clock)"/>

  <!-- Hour markers -->
  <circle cx="32" cy="18" r="1.5" fill="#E2E8F0"/>
  <circle cx="46" cy="32" r="1.5" fill="#E2E8F0"/>
  <circle cx="32" cy="46" r="1.5" fill="#E2E8F0"/>
  <circle cx="18" cy="32" r="1.5" fill="#E2E8F0"/>

  <!-- Clock hands -->
  <line x1="32" y1="32" x2="32" y2="22" stroke="url(#hands)" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="41" y2="32" stroke="url(#hands)" stroke-width="3" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="32" cy="32" r="2.5" fill="#E2E8F0"/>

  <!-- Active indicator -->
  <circle cx="50" cy="50" r="5" fill="#22C55E"/>
</svg>
